[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "lightgbm",
    "xgboost",
    "catboost",
    "mlflow",
    "shap",
    "optuna",
    "pyyaml",
    "great-expectations>=1.24.0",
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "gradio>=6.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "nbstripout",
    "jupyterlab",
    "ipykernel",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Repo root on the import path so tests can import the app/ folder (heart/ is installed)
pythonpath = ["."]

[tool.ruff]
line-length = 100
