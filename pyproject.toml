[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "lightgbm",
    "xgboost",
    "catboost",
    "mlflow",
    "shap",
    "optuna",
    "pyyaml",
    "great-expectations>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbstripout", "jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
